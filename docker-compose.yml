version: '3.8'

services:
  nested-char-api:
    build: .
    container_name: nested-char-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./input_images:/app/input_images
      - ./output_images:/app/output_images
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
